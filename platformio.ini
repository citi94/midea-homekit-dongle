; Midea/Senville mini-split -> native HomeKit dongle
; ESP32-S3 dev board (S3-N16R8: 16MB flash, dual USB-C, CH343P USB-serial)
; HomeSpan (HAP) + MideaUART (AC protocol)

; secrets.ini is gitignored — copy secrets.example.ini and fill in your
; OTA password (only needed for the *-ota envs).
[platformio]
extra_configs = secrets.ini

[env:esp32s3]
; pioarduino platform: ships Arduino-ESP32 core 3.x (required by HomeSpan 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; N16R8 module: 16MB flash (board default assumes 8MB)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
lib_deps =
    homespan/HomeSpan@^2.1.8
    ; MideaUART is VENDORED in lib/MideaUART (from upstream commit eeea6c3,
    ; v1.1.9) with local patches — see lib/MideaUART/PATCHES.md
build_flags =
    ; MideaUART verbosity: 3 = INFO (bring-up is done; raise to 5 = DEBUG
    ; to get TX/RX frame hex dumps again when diagnosing link problems)
    -DLOG_LEVEL=3
    ; Serial -> native USB port (this board's CH343 port has a broken
    ; auto-reset circuit; the native port is the one that flashes reliably)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; OTA flashing once the dongle is inside the AC: pio run -e ota -t upload
[env:ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = 192.168.2.10
upload_flags = --auth=${secrets.ota_auth}

; ESP32-S3-Zero clone (diymore "S3 Mini"): 4MB flash, WS2812 on GP21,
; native-USB only. BSS138 shifter stacks onto the left edge header with its
; LV row reversed: LV3->5V (modded as a power pass-through: channel-3 HV
; pull-up and FET removed, pads bridged drain-to-source), GND->GND,
; LV->3V3, LV2->GP1 (ESP TX), LV1->GP2 (ESP RX). AC cable lands on the HV
; row: VBUS->HV, GND->GND, AC TXD->HV1, AC RXD->HV2.
; First flash over USB-C (AC cable UNPLUGGED — 5V pin is tied to USB VBUS!),
; everything after that via env:s3zero-ota.
[env:s3zero]
extends = env:esp32s3
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; min_spiffs: 2x ~1.9MB app slots keeps OTA working on 4MB flash
board_build.partitions = min_spiffs.csv
build_flags =
    ${env:esp32s3.build_flags}
    ; Bench-verified (multimeter, daughter board pads): AC TXD -> HV1 ->
    ; LV1 -> GP2 (ESP RX); AC RXD <- HV2 <- LV2 <- GP1 (ESP TX)
    -DAC_TX_PIN=1
    -DAC_RX_PIN=2
    -DSTATUS_PIXEL_PIN=21

[env:s3zero-ota]
extends = env:s3zero
upload_protocol = espota
upload_port = 192.168.2.10
upload_flags = --auth=${secrets.ota_auth}
